name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck --if-present
        continue-on-error: true

      - name: Build
        run: |
          if [ -z "$VITE_EE_API_URL" ]; then
            export VITE_EE_API_URL="https://seva-gis-backend-419602015618.us-central1.run.app"
          fi
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_GOOGLE_CLIENT_ID: ${{ secrets['VITE_GOOGLE_CLIENT_ID'] || vars['VITE_GOOGLE_CLIENT_ID'] || '' }}
          VITE_EE_API_URL: ${{ secrets['VITE_EE_API_URL'] || vars['VITE_EE_API_URL'] || '' }}

      - name: SPA fallback + CNAME + Version Stamping
        run: |
          cp dist/index.html dist/404.html
          [ -f dist/CNAME ] || echo "sevagis.dpdns.org" > dist/CNAME
          node -e '
            const fs = require("fs");
            const vPath = "dist/version.json";
            if (fs.existsSync(vPath)) {
              const v = JSON.parse(fs.readFileSync(vPath, "utf-8"));
              v.buildDate = new Date().toISOString();
              v.commit = "${{ github.sha }}";
              v.buildNumber = ${{ github.run_number }};
              fs.writeFileSync(vPath, JSON.stringify(v, null, 2));
            }
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android-build:
    name: Build Android APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seva-gis-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

