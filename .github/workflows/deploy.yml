name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: |
          if [ -z "$VITE_EE_API_URL" ]; then
            export VITE_EE_API_URL="https://seva-gis-backend-419602015618.us-central1.run.app"
          fi
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_APK_VERSION_CODE: "45"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets['VITE_GOOGLE_CLIENT_ID'] || vars['VITE_GOOGLE_CLIENT_ID'] || '' }}
          VITE_EE_API_URL: ${{ secrets['VITE_EE_API_URL'] || vars['VITE_EE_API_URL'] || '' }}

      - name: SPA fallback + CNAME + Version Verification
        run: |
          cp dist/index.html dist/404.html
          [ -f dist/CNAME ] || echo "sevagis.dpdns.org" > dist/CNAME
          cat dist/version.json
          cat dist/updates/latest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android-build:
    needs: build
    uses: ./.github/workflows/android-build.yml
    secrets: inherit
