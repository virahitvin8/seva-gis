name: SEVA.GIS Web & Android Live OTA Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy-web-and-android-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEVA.GIS Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install & Build Production Bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_APK_VERSION_CODE: "46"
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Publish OTA Bundle to Installed Android Apps (No APK Reinstall)
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
        run: |
          if [ -n "$CAPGO_API_KEY" ]; then
            npx --yes @capgo/cli bundle upload --channel Production --apikey "$CAPGO_API_KEY"
          else
            echo "CAPGO_API_KEY not configured in GitHub Secrets; live GitHub Pages + version.json SW auto-update handles Android WebView sync."
          fi
