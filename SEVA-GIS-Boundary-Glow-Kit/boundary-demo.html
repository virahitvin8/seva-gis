<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEVA.GIS boundary processing demo</title><link rel="stylesheet" href="seva-boundary-processing.css"><style>
:root{--demo-bg:oklch(.18 .03 155);--demo-text:oklch(.97 .01 150);--demo-muted:oklch(.76 .03 150);--demo-border:oklch(.4 .05 150);--demo-panel:oklch(.24 .04 155)}*{box-sizing:border-box}body{margin:0;background:var(--demo-bg);color:var(--demo-text);font:16px system-ui,sans-serif}main{max-width:960px;margin:50px auto;padding:24px}h1{font-size:30px}p{color:var(--demo-muted)}.map{position:relative;background:var(--demo-panel);border:1px solid var(--demo-border);aspect-ratio:16/9}svg{width:100%;height:100%}.field{fill:var(--demo-border);opacity:.3;stroke:var(--demo-muted);stroke-width:1}button{font:inherit;padding:12px 18px;margin:16px 8px 0 0;background:var(--demo-panel);color:var(--demo-text);border:1px solid var(--demo-border);border-radius:6px;cursor:pointer}button:focus-visible{outline:2px solid var(--seva-process-core);outline-offset:3px}[hidden]{display:none}#status{display:block;margin-top:18px}
</style><main><h1>SEVA.GIS / Boundary processing</h1><p>Illustrative boundary — no satellite request or measured progress.</p><div class="map"><svg viewBox="0 0 900 506" aria-label="Illustrative farm boundary"><path class="field" d="M0 60L900 210M0 170L900 330M0 300L900 450M160 0L90 506M360 0L290 506M570 0L500 506M780 0L710 506"/><path class="field" d="M170 340L260 125L680 160L720 360L420 405Z"/><g id="effect" hidden><path class="seva-boundary-rail" pathLength="1000" d="M170 340L260 125L680 160L720 360L420 405Z"/><path class="seva-boundary-halo" pathLength="1000" d="M170 340L260 125L680 160L720 360L420 405Z"/><path class="seva-boundary-comet" pathLength="1000" d="M170 340L260 125L680 160L720 360L420 405Z"/></g></svg></div><button id="start">Start processing</button><button id="finish">Finish</button><button id="fail">Simulate error</button><output id="status" role="status" aria-live="polite">Ready</output></main><script>const effect=document.getElementById('effect'),status=document.getElementById('status');function set(text,active){if(active){effect.removeAttribute("hidden")}else{effect.setAttribute("hidden","")}document.querySelector('.map').setAttribute('aria-busy',String(active));status.textContent=text}document.getElementById('start').onclick=()=>set('Processing satellite imagery…',true);document.getElementById('finish').onclick=()=>set('Processing finished.',false);document.getElementById('fail').onclick=()=>set('Processing failed. The boundary animation has stopped.',false);</script></html>
