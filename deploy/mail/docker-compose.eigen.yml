# SEVA.GIS + Eigen Workspace (MIT License — https://github.com/eigen-is/eigen)
# Full Bun + SQLite workspace companion with IMAP/SMTP/WebDAV bridge for agronomy teams.
# Clone upstream eigen or pass EIGEN_SMTP_HOST / EIGEN_API_URL in .env.

services:
  seva-gis:
    image: ghcr.io/virahitvin8/seva-gis:main
    container_name: seva-gis-eigen
    restart: unless-stopped
    ports:
      - "8443:8080"
    environment:
      - SMTP_HOST=${EIGEN_SMTP_HOST:-localhost}
      - SMTP_PORT=${EIGEN_SMTP_PORT:-587}
      - SMTP_USER=${EIGEN_SMTP_USER:-}
      - SMTP_PASS=${EIGEN_SMTP_PASS:-}
      - MAIL_WORKER_URL=${EIGEN_MAIL_API_URL:-}
      - MAIL_WORKER_TOKEN=${EIGEN_MAIL_API_TOKEN:-}
      - ALLOWED_ORIGINS=https://sevagis.dpdns.org,https://sevagis.is-a.bot,https://seva-gis.vercel.app,https://localhost,capacitor://localhost

