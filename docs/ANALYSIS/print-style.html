<style>
  @page { size: A4; margin: 16mm 14mm 18mm 14mm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    font-size: 10.5pt; line-height: 1.5; color: #1d2b26; margin: 0;
  }
  h1 { font-size: 22pt; color: #10302a; border-bottom: 3px solid #2f6b4f; padding-bottom: 6px; margin: 0 0 14px; }
  h2 { font-size: 15pt; color: #10302a; margin: 22px 0 8px; border-bottom: 1.5px solid #cfe0d7; padding-bottom: 4px; page-break-after: avoid; }
  h3 { font-size: 12pt; color: #2f6b4f; margin: 16px 0 6px; page-break-after: avoid; }
  p, li { orphans: 3; widows: 3; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0 16px; font-size: 8.6pt; page-break-inside: auto; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  th { background: #10302a; color: #ffffff; text-align: left; padding: 5px 7px; font-weight: 600; border: 1px solid #10302a; }
  td { padding: 4px 7px; border: 1px solid #d5e2db; vertical-align: top; }
  tbody tr:nth-child(even) td { background: #f6faf8; }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 8.6pt; background: #eef4f1; padding: 1px 4px; border-radius: 3px; color: #16443a; }
  pre { background: #f4f7f6; border-left: 3px solid #2f6b4f; padding: 9px 11px; overflow-x: auto; page-break-inside: avoid; border-radius: 4px; }
  pre code { background: none; padding: 0; font-size: 8.4pt; line-height: 1.35; }
  blockquote { border-left: 4px solid #2b5f9e; background: #f2f7ff; margin: 10px 0; padding: 8px 12px; color: #22394f; }
  a { color: #1c5f8f; text-decoration: none; }
  img { max-width: 100%; page-break-inside: avoid; }
  hr { border: none; border-top: 1px solid #d5e2db; margin: 18px 0; }
  input[type=checkbox] { display: none; }
  .title-block { display: none; }
  h2 + p, h3 + p { margin-top: 4px; }
</style>
