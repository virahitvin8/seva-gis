<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38f2d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circular emblem -->
  <circle cx="50" cy="50" r="46" fill="#0a1912" stroke="#1b4332" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="url(#glowGrad)"/>
  
  <!-- Orbiting Satellite Arc -->
  <path d="M 22 66 C 16 46 28 25 52 21 C 72 18 86 32 84 50" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="3.5 2.5" opacity="0.9"/>
  <circle cx="84" cy="50" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M 79 50 L 89 50 M 84 45 L 84 55" stroke="#f0f9ff" stroke-width="1.2"/>

  <!-- Precision Sprout / Leaf Geo-Mark -->
  <!-- Left Leaf -->
  <path d="M 50 72 C 40 64 30 56 31 42 C 32 30 45 26 50 22 C 50 34 52 46 50 72 Z" fill="url(#leafGrad)"/>
  <!-- Right Leaf -->
  <path d="M 50 72 C 57 64 69 54 68 40 C 67 32 58 27 50 22 C 54 34 56 48 50 72 Z" fill="#34d399" opacity="0.9"/>
  <!-- Central Leaf Vein -->
  <path d="M 50 72 L 50 28" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Soil Ridge / Furrows -->
  <path d="M 32 77 C 42 82 58 82 68 77" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 38 83 C 45 86 55 86 62 83" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
</svg>
